<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>
    <radialGradient id="specular" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark circular backdrop for high contrast anywhere -->
  <circle cx="32" cy="32" r="30" fill="#090C12" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Liquid Droplet Pipette Shape with dynamic gradient -->
  <path d="M32 8 C32 8, 48 24, 48 37 C48 46.4 40.8 54 32 54 C23.2 54 16 46.4 16 37 C16 24, 32 8, 32 8 Z" 
        fill="url(#dropGrad)" 
        filter="url(#glow)"/>

  <!-- Specular 3D light reflection highlight -->
  <ellipse cx="27" cy="32" rx="6" ry="11" transform="rotate(-25 27 32)" fill="url(#specular)"/>
  
  <!-- Tiny bottom ambient reflection -->
  <ellipse cx="36" cy="46" rx="4" ry="2" fill="#ffffff" opacity="0.35"/>
</svg>
